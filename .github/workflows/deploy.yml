name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Download pose models
        run: npm run fetch-models
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 若 Pages 仍設定為「從分支部署」，內建的 pages build 會同時發布原始碼；
      # 等它完成後再部署，確保建置後的網站覆蓋上去（Source 改為 GitHub Actions 後可移除）
      - name: Wait for legacy pages build
        run: sleep 90
      - id: deployment
        uses: actions/deploy-pages@v4
